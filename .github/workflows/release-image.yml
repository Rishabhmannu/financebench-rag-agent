name: Build and push API image

# Triggered on every `v*` tag push. Builds the API image on native arm64 and
# amd64 runners (parallel), then merges into a single multi-arch manifest list
# tagged with both the full version (e.g. `0.2.0`) and the major.minor (e.g.
# `0.2`). Wizard's compose.minimal.yml pulls by the full version derived from
# cli.__version__ so each release is pinned; the `0.2` tag is for users who
# manually pull a "stay on 0.2.x" mode.
#
# Auth: uses the workflow-default GITHUB_TOKEN which has `packages: write`
# scope for the same repo's GHCR namespace. No PAT setup needed.
#
# First-time setup: when the workflow runs for the very first time, the
# resulting package is PRIVATE by default on GHCR. The repo owner must
# manually toggle "Package visibility" to Public via the GitHub UI:
#   https://github.com/users/Rishabhmannu/packages/container/financebench-rag-agent-api/settings
# Subsequent pushes inherit the public visibility.

on:
  push:
    tags:
      - 'v*'
  # 0.2.x heavy-smoke verification: workflow_dispatch lets us manually
  # re-trigger the verify job against an existing release tag — useful
  # when iterating the heavy smoke without cutting a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to verify against (e.g. v0.2.0). Skips build + merge; only runs verify."
        required: true
        type: string
        default: "v0.2.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: financebench-rag-agent-api

jobs:
  build:
    # Only run build + merge on tag push. On workflow_dispatch we're
    # verifying an existing image, so skip the rebuild.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            short_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            short_arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image ref
        id: image
        # GHCR requires lowercase namespace. github.repository_owner can be
        # mixed-case (e.g. "Rishabhmannu") so we explicitly downcase.
        run: |
          repo_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=${{ env.REGISTRY }}/${repo_lc}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.short_arch }}
          cache-to: type=gha,scope=${{ matrix.short_arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.short_arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Extract version tags from git ref
        id: tags
        # GITHUB_REF_NAME is e.g. "v0.2.0"; strip leading "v" for the version
        # tag, then derive the major.minor (e.g. "0.2") for the floating tag.
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor=$(echo "$version" | cut -d. -f1-2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image ref
        id: image
        run: |
          repo_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=${{ env.REGISTRY }}/${repo_lc}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ steps.image.outputs.ref }}:${{ steps.tags.outputs.version }} \
            -t ${{ steps.image.outputs.ref }}:${{ steps.tags.outputs.minor }} \
            $(printf '${{ steps.image.outputs.ref }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            ${{ steps.image.outputs.ref }}:${{ steps.tags.outputs.version }}

  # Heavy install-path smoke. Pulls the just-published GHCR image, spins
  # up the minimal stack on a fresh ubuntu-latest runner, waits for
  # /v1/health, then verifies the deployed semver matches the tag.
  #
  # Catches runtime regressions that the cheap smoke (smoke-install.yml)
  # can't — container start failures, missing deps inside the image,
  # health endpoint hangs, version-string drift between the wheel and
  # the image.
  #
  # Triggers:
  #   - automatically after merge succeeds on tag push
  #   - manually via workflow_dispatch with an `tag` input — useful for
  #     re-running against an existing release without cutting a new one.
  verify:
    needs: merge
    # always() so that on workflow_dispatch (where merge is skipped) the
    # second clause still fires.
    if: always() && (needs.merge.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Determine tag + version
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repo at the verified tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Create placeholder .env from .env.example
        # The smoke checks /v1/health (which doesn't authenticate against
        # any LLM provider) and /version (also unauth). So we can run the
        # backend with placeholder keys — no real API calls fire.
        run: |
          cp .env.example .env
          sed -i 's|^OPENAI_API_KEY=.*|OPENAI_API_KEY=sk-placeholder-not-used-by-health-smoke|' .env
          sed -i 's|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=sk-ant-placeholder-not-used-by-health-smoke|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=verify-job-jwt-secret-not-for-prod|' .env

      - name: Pre-create bind-mount targets with permissive perms
        # compose.minimal.yml bind-mounts ./logs and ./cost_logs into the
        # container at /app/logs and /app/cost_logs. The container runs as
        # appuser (UID 1000). On Docker Desktop / macOS, file-sharing
        # translates host UIDs transparently, so M1 users don't hit this.
        # On raw Linux (the CI runner) the bind mount preserves ownership:
        # the runner is `runner` (UID 1001), so logs/ created via mkdir
        # would be owned by 1001 — appuser can't write. The runtime then
        # PermissionErrors on the first attach_file_handler() call, the
        # lifespan dies, /v1/health never comes up.
        #
        # Pre-create with 777 so any in-container user can write. Smoke-
        # only — production users should leave the default umask.
        run: |
          mkdir -p logs cost_logs
          chmod 777 logs cost_logs

      - name: docker compose pull (api from GHCR + qdrant/postgres/redis)
        env:
          FB_IMAGE_TAG: ${{ steps.target.outputs.version }}
        run: |
          docker compose -f compose.minimal.yml pull

      - name: docker compose up -d
        env:
          FB_IMAGE_TAG: ${{ steps.target.outputs.version }}
        run: |
          docker compose -f compose.minimal.yml up -d

      - name: Wait for /v1/health 200 (max 5 min)
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/v1/health > /dev/null 2>&1; then
              echo "API healthy after probe ${i} (~$((i * 5))s)"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: /v1/health did not return 200 within 5 min"
          docker compose -f compose.minimal.yml logs api --tail 200
          exit 1

      - name: Verify /version semver matches the tag
        env:
          EXPECTED: ${{ steps.target.outputs.version }}
        run: |
          payload=$(curl -fs http://localhost:8000/version)
          echo "/version payload: $payload"
          actual=$(echo "$payload" | python3 -c "import json, sys; print(json.load(sys.stdin)['semver'])")
          echo "Backend semver: $actual  (expected: $EXPECTED)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "ERROR: backend semver $actual doesn't match tag $EXPECTED"
            exit 1
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.minimal.yml down -v 2>&1 | tail -20
